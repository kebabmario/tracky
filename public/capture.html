<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send to Tracky</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #0f1124; --ink-2: #454a5e; --muted: #5d6275; --line: #e4e2da; --cream: #f7f4ec; --soft: #f1eee5;
  --blue: #2547ff; --blue-ink: #1a33c2; --yellow: #ffd84d; --ok: #13795b; --bad: #b42318; --display: 'Schibsted Grotesk', system-ui, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--ink); font: 400 15px/1.5 Figtree, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
main { max-width: 520px; margin: 0 auto; padding: 22px 20px 32px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font: 600 21px/1 var(--display); letter-spacing: -.04em; color: var(--ink); text-decoration: none; }
.brand img { width: 28px; height: 28px; }
h1 { margin: 18px 0 4px; font: 600 26px/1.15 var(--display); letter-spacing: -.03em; }
.lede { margin: 0; color: var(--ink-2); }
.from { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--cream); color: var(--ink-2); font-size: 13.5px; overflow-wrap: anywhere; }
.from b { color: var(--ink); }
form { display: grid; gap: 14px; margin-top: 18px; }
label { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; }
input, select { width: 100%; height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); font: 500 15px Figtree, sans-serif; outline: none; }
input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37, 71, 255, .12); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.cands { display: grid; gap: 6px; }
.cands h2 { margin: 6px 0 0; font: 600 15px var(--display); }
.cand { display: block; width: 100%; padding: 9px 12px; border: 0; border-radius: 10px; background: var(--cream); color: var(--ink-2); font: 500 13px Figtree, sans-serif; text-align: left; cursor: pointer; }
.cand:hover { background: var(--soft); color: var(--ink); }
.cand b { color: var(--blue-ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font: 600 15px Figtree, sans-serif; cursor: pointer; }
.btn:hover { background: var(--blue-ink); }
.btn:disabled { opacity: .6; cursor: progress; }
.msg { padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; }
.msg.ok { background: #e2f3ec; color: var(--ok); }
.msg.bad { background: #fde6e3; color: var(--bad); }
.msg[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img src="logo.svg" alt="">tracky</a>
  <h1>Send to Tracky</h1>
  <p class="lede">Check the price picked from the page, fix it if needed, then save.</p>
  <div class="from" id="from">Opened directly: type the price in yourself.</div>

  <form id="f" novalidate>
    <label>Material
      <select id="series" required>
        <option value="">Choose…</option>
        <option value="as">AS (SAN)</option>
        <option value="ppBlock">PP block copolymer</option>
      </select>
    </label>
    <div class="row2">
      <label>Price <span class="hint">CNY per tonne</span>
        <input id="price" inputmode="decimal" placeholder="e.g. 9800" required>
      </label>
      <label>Date
        <input id="date" type="date" required>
      </label>
    </div>
    <div class="msg" id="msg" role="status" hidden></div>
    <button class="btn" id="save" type="submit">Save price</button>
  </form>

  <div class="cands" id="cands"></div>
</main>

<script type="module">
import { guessMaterial, guessDate, guessPrices, candidateRows } from './capture-parse.js';

const $ = (id) => document.getElementById(id);
const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD in the viewer's time zone
let payload = {};
try { payload = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}'); } catch { payload = {}; }
const rows = Array.isArray(payload.r) ? payload.r.map(String).slice(0, 200) : [];
const sel = String(payload.s || '').slice(0, 1000);
const src = typeof payload.u === 'string' && /^https?:\/\//.test(payload.u) ? payload.u.slice(0, 300) : '';

$('date').max = today;
if (src) {
  const host = new URL(src).hostname;
  $('from').textContent = '';
  $('from').append('From ', Object.assign(document.createElement('b'), { textContent: host }),
    sel ? ` · selected: “${sel.slice(0, 80)}${sel.length > 80 ? '…' : ''}”` : '');
}

const material = guessMaterial(sel, payload.t, src, rows.join(' '));
$('series').value = material;
$('date').value = guessDate(`${sel} ${payload.t || ''} ${rows.join(' ')}`, today);
const first = guessPrices(sel)[0] ?? guessPrices(candidateRows(rows, material)[0])[0];
if (first) $('price').value = first;

// One-click rows from the page's tables, in case the guess picked the wrong number.
const cands = candidateRows(rows, material);
if (cands.length) {
  const box = $('cands');
  box.append(Object.assign(document.createElement('h2'), { textContent: 'Prices found on the page' }));
  for (const r of cands) {
    const p = guessPrices(r)[0];
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cand';
    b.append(Object.assign(document.createElement('b'), { textContent: p.toLocaleString('en-US') }), ` · ${r.slice(0, 140)}`);
    b.onclick = () => {
      $('price').value = p;
      const d = guessDate(r, today);
      if (/(20\d{2})\s*[-/.年]/.test(r)) $('date').value = d; // only when the row carries its own date
      $('price').focus();
    };
    box.append(b);
  }
}

const show = (text, ok) => { const m = $('msg'); m.hidden = false; m.className = 'msg ' + (ok ? 'ok' : 'bad'); m.textContent = text; };
$('f').onsubmit = async (e) => {
  e.preventDefault();
  const body = { series: $('series').value, price: Number(String($('price').value).replace(/[,\s]/g, '')), date: $('date').value, ...(src && { src }) };
  if (!body.series) return show('Choose the material.', false);
  $('save').disabled = true;
  try {
    const res = await fetch('/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || 'Could not save');
    show(`Saved ${$('series').selectedOptions[0].text} at ${body.price.toLocaleString('en-US')} CNY/t for ${body.date}.`, true);
    if (window.opener) setTimeout(() => window.close(), 1500);
  } catch (err) {
    show(err.message, false);
  } finally {
    $('save').disabled = false;
  }
};
</script>
</body>
</html>
