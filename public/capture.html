<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send to Tracky</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --ink: #0f1124; --ink-2: #454a5e; --muted: #5d6275; --line: #e4e2da; --cream: #f7f4ec; --soft: #f1eee5;
  --blue: #2547ff; --blue-ink: #1a33c2; --yellow: #ffd84d; --ok: #13795b; --bad: #b42318; --display: 'Inter Tight', system-ui, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--ink); font: 400 15px/1.5 Figtree, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
main { max-width: 520px; margin: 0 auto; padding: 22px 20px 32px; }
.brand { display: inline-flex; align-items: center; gap: 9px; font: 600 21px/1 var(--display); letter-spacing: -.04em; color: var(--ink); text-decoration: none; }
.brand img { width: 28px; height: 28px; }
h1 { margin: 18px 0 4px; font: 600 26px/1.15 var(--display); letter-spacing: -.03em; }
.lede { margin: 0; color: var(--ink-2); }
.from { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: var(--cream); color: var(--ink-2); font-size: 13.5px; overflow-wrap: anywhere; }
.from b { color: var(--ink); }
form { display: grid; gap: 14px; margin-top: 18px; }
label { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; }
input, select { width: 100%; height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); font: 500 15px Figtree, sans-serif; outline: none; }
input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37, 71, 255, .12); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.cands { display: grid; gap: 6px; }
.cands h2 { margin: 6px 0 0; font: 600 15px var(--display); }
.cand { display: block; width: 100%; padding: 9px 12px; border: 0; border-radius: 10px; background: var(--cream); color: var(--ink-2); font: 500 13px Figtree, sans-serif; text-align: left; cursor: pointer; }
.cand:hover { background: var(--soft); color: var(--ink); }
.cand b { color: var(--blue-ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font: 600 15px Figtree, sans-serif; cursor: pointer; }
.btn:hover { background: var(--blue-ink); }
.btn:disabled { opacity: .6; cursor: progress; }
.msg { padding: 12px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; }
.msg.ok { background: #e2f3ec; color: var(--ok); }
.msg.bad { background: #fde6e3; color: var(--bad); }
.msg[hidden] { display: none; }
.hist { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--cream); }
.hist[hidden] { display: none; }
.hist h2 { margin: 0; font: 600 15px var(--display); }
.hist p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.hist .chk { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.hist .chk input { width: 18px; height: 18px; accent-color: var(--blue); }
.hist svg { display: block; width: 100%; height: 56px; }
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><img src="logo.svg" alt="">tracky</a>
  <h1>Send to Tracky</h1>
  <p class="lede">Check the price picked from the page, fix it if needed, then save.</p>
  <div class="from" id="from">Opened directly: type the price in yourself.</div>

  <form id="f" novalidate>
    <label>Material
      <select id="series" required>
        <option value="">Choose…</option>
        <option value="as">AS (SAN)</option>
        <option value="ppBlock">PP block copolymer</option>
        <option value="abs">ABS</option>
        <option value="ppHomo">PP homopolymer</option>
      </select>
    </label>
    <div class="row2">
      <label>Price <span class="hint">CNY per tonne</span>
        <input id="price" inputmode="decimal" placeholder="e.g. 9800" required>
      </label>
      <label>Date
        <input id="date" type="date" required>
      </label>
    </div>
    <div class="hist" id="hist" hidden>
      <h2>Chart history found</h2>
      <label>Series
        <select id="hseries"></select>
      </label>
      <svg id="hspark" viewBox="0 0 300 56" preserveAspectRatio="none" aria-hidden="true"></svg>
      <p id="hsum"></p>
      <label class="chk"><input type="checkbox" id="hsave" checked> Save the whole chart history</label>
    </div>
    <div class="msg" id="msg" role="status" hidden></div>
    <button class="btn" id="save" type="submit">Save price</button>
  </form>

  <div class="cands" id="cands"></div>
</main>

<script type="module">
import { guessMaterial, guessDate, guessPrices, candidateRows, normalizeHistory } from './capture-parse.js';

const $ = (id) => document.getElementById(id);
const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD in the viewer's time zone
let payload = {};
try { payload = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}'); } catch { payload = {}; }
const rows = Array.isArray(payload.r) ? payload.r.map(String).slice(0, 200) : [];
const sel = String(payload.s || '').slice(0, 1000);
const src = typeof payload.u === 'string' && /^https?:\/\//.test(payload.u) ? payload.u.slice(0, 300) : '';

$('date').max = today;
if (src) {
  const host = new URL(src).hostname;
  $('from').textContent = '';
  $('from').append('From ', Object.assign(document.createElement('b'), { textContent: host }),
    sel ? ` · selected: “${sel.slice(0, 80)}${sel.length > 80 ? '…' : ''}”` : '');
}

const material = guessMaterial(sel, payload.t, src, rows.join(' '));
$('series').value = material;
$('date').value = guessDate(`${sel} ${payload.t || ''} ${rows.join(' ')}`, today);
const first = guessPrices(sel)[0] ?? guessPrices(candidateRows(rows, material)[0])[0];
if (first) $('price').value = first;

// Chart history read by the bookmarklet from charts on the page (one entry per chart series).
const histories = (Array.isArray(payload.h) ? payload.h : []).slice(0, 8)
  .map((h, i) => ({ name: String(h?.n || '').slice(0, 60) || `Series ${i + 1}`, pts: normalizeHistory(Array.isArray(h?.p) ? h.p.slice(-1500) : [], today) }))
  .filter((h) => h.pts.length > 1);
const fmtD = (iso) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
const curHist = () => histories[+$('hseries').value];
function drawHist() {
  const h = curHist(), ys = h.pts.map((p) => p.price), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const d = h.pts.map((p, i) => `${((i / (h.pts.length - 1)) * 300).toFixed(1)},${(52 - ((p.price - lo) / span) * 48).toFixed(1)}`).join(' L');
  $('hspark').innerHTML = `<path d="M${d}" fill="none" stroke="#2547ff" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  const out = ys.filter((v) => v < 1000 || v > 100000).length;
  $('hsum').textContent = `${h.pts.length.toLocaleString('en-US')} prices from ${fmtD(h.pts[0].date)} to ${fmtD(h.pts.at(-1).date)}, `
    + `low ${lo.toLocaleString('en-US')}, high ${hi.toLocaleString('en-US')} CNY/t.` + (out ? ` ${out} outside 1,000–100,000 CNY/t will be skipped.` : '');
  // Latest chart point fills the single-price fields when the page text gave nothing better.
  if (!first) { $('price').value = h.pts.at(-1).price; $('date').value = h.pts.at(-1).date; }
}
if (histories.length) {
  // Prefer the series whose name matches the material, else the longest one.
  const byName = histories.findIndex((h) => material && guessMaterial(h.name) === material);
  const best = byName >= 0 ? byName : histories.reduce((b, h, i) => (h.pts.length > histories[b].pts.length ? i : b), 0);
  $('hseries').innerHTML = histories.map((h, i) => `<option value="${i}">${h.name.replace(/[<>&"]/g, '')} · ${h.pts.length} prices</option>`).join('');
  $('hseries').value = best;
  $('hseries').onchange = drawHist;
  $('hist').hidden = false;
  drawHist();
  $('save').textContent = 'Save prices';
}

// One-click rows from the page's tables, in case the guess picked the wrong number.
const cands = candidateRows(rows, material);
if (cands.length) {
  const box = $('cands');
  box.append(Object.assign(document.createElement('h2'), { textContent: 'Prices found on the page' }));
  for (const r of cands) {
    const p = guessPrices(r)[0];
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cand';
    b.append(Object.assign(document.createElement('b'), { textContent: p.toLocaleString('en-US') }), ` · ${r.slice(0, 140)}`);
    b.onclick = () => {
      $('price').value = p;
      const d = guessDate(r, today);
      if (/(20\d{2})\s*[-/.年]/.test(r)) $('date').value = d; // only when the row carries its own date
      $('price').focus();
    };
    box.append(b);
  }
}

const show = (text, ok) => { const m = $('msg'); m.hidden = false; m.className = 'msg ' + (ok ? 'ok' : 'bad'); m.textContent = text; };
$('f').onsubmit = async (e) => {
  e.preventDefault();
  const single = { date: $('date').value, price: Number(String($('price').value).replace(/[,\s]/g, '')) };
  const series = $('series').value;
  if (!series) return show('Choose the material.', false);
  // With history ticked, send every chart point plus the single price (which wins on its own date).
  const withHist = histories.length && $('hsave').checked;
  const points = withHist ? [...curHist().pts.filter((p) => p.date !== single.date), single] : [single];
  const body = { series, points, ...(src && { src }) };
  $('save').disabled = true;
  try {
    const res = await fetch('/api/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || 'Could not save');
    const name = $('series').selectedOptions[0].text;
    show(withHist ? `Saved ${j.saved.toLocaleString('en-US')} ${name} prices${j.skipped ? ` (${j.skipped} skipped)` : ''}.`
      : `Saved ${name} at ${single.price.toLocaleString('en-US')} CNY/t for ${single.date}.`, true);
    if (window.opener) setTimeout(() => window.close(), 2000);
  } catch (err) {
    show(err.message, false);
  } finally {
    $('save').disabled = false;
  }
};
</script>
</body>
</html>
